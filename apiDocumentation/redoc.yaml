openapi: 3.0.3
info:
  title: Job Hunter Backend API
  description: Backend API for Job Hunter tracking and management platform covering Server Health, Authentication, and User Management.
  version: 1.0.0
  contact:
    name: Job Hunter Team

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Server Health
    description: Server status and health check
  - name: Authentication
    description: User registration, login, and profile management
  - name: User Management
    description: Superadmin user administration and role management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Authorization header using Bearer scheme. Example: "Authorization: Bearer {token}"'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: cm20xyz123
        email:
          type: string
          format: email
          example: user@example.com
        name:
          type: string
          nullable: true
          example: John Doe
        role:
          type: string
          enum: [SUPERADMIN, USER]
          example: USER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@jobhunter.local
        password:
          type: string
          minLength: 6
          example: Password123!
        name:
          type: string
          example: Super Admin
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@jobhunter.local
        password:
          type: string
          example: Password123!
    UpdateRoleInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [SUPERADMIN, USER]
          example: SUPERADMIN

paths:
  /:
    get:
      tags:
        - Server Health
      summary: Root status check
      description: Confirms the server is working and lists main endpoints
      responses:
        "200":
          description: Server is working
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Job Hunter Server is working!
                  status:
                    type: string
                    example: UP
                  runtime:
                    type: string
                    example: cloudflare-workers

  /health:
    get:
      tags:
        - Server Health
      summary: Check server health
      description: Returns server status (UP), uptime in seconds, and port
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  uptimeSeconds:
                    type: number
                    example: 42
                  timestamp:
                    type: string
                    format: date-time
                  port:
                    type: number
                    example: 3000

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: First registered user in database automatically receives SUPERADMIN role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
            example:
              email: admin@jobhunter.local
              password: Password123!
              name: Super Admin
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Validation error
        "409":
          description: User already exists

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates user credentials and returns JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: admin@jobhunter.local
              password: Password123!
      responses:
        "200":
          description: Login successful with JWT token
        "401":
          description: Invalid email or password

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /api/users:
    get:
      tags:
        - User Management
      summary: List all users (SUPERADMIN only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of registered users
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - requires SUPERADMIN role

  /api/users/{id}/role:
    patch:
      tags:
        - User Management
      summary: Update user role (SUPERADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: target_user_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
            example:
              role: SUPERADMIN
      responses:
        "200":
          description: Role updated successfully
        "400":
          description: Invalid role or cannot demote sole superadmin
        "404":
          description: User not found

  /api/users/{id}:
    delete:
      tags:
        - User Management
      summary: Delete user (SUPERADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: target_user_id
      responses:
        "200":
          description: User deleted successfully
        "400":
          description: Cannot delete own account
        "404":
          description: User not found
